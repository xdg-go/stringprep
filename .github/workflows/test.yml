on: [push, pull_request]
name: CI
jobs:
  test:
    strategy:
      matrix:
        # "go.mod" tests the minimum version declared in go.mod
        go: [go.mod, oldstable, stable]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}
        go-version: ${{ matrix.go != 'go.mod' && matrix.go || '' }}
    - name: Test
      run: go test -race ./...
